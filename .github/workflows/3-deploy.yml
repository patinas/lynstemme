name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', 'wrangler.jsonc', 'index.html', 'vite.config.ts', '.github/workflows/deploy.yml']
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Verify token and resolve authorized account
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          verify=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          test "$(jq -r '.result.status' <<<"$verify")" = active
          accounts=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=50')
          count=$(jq '.result | length' <<<"$accounts")
          test "$count" -eq 1 || { echo "Token must expose exactly one Cloudflare account; found $count" >&2; exit 1; }
          account_id=$(jq -r '.result[0].id' <<<"$accounts")
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure Groq Worker secret
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --config dist/lynstemme/wrangler.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
      - name: Configure private-access secret
        run: printf '%s' "$LYNSTEMME_PASSWORD" | npx wrangler secret put APP_PASSWORD --config dist/lynstemme/wrangler.json
        env:
          LYNSTEMME_PASSWORD: ${{ secrets.LYNSTEMME_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
      - name: Deploy
        run: npx wrangler deploy --config dist/lynstemme/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
